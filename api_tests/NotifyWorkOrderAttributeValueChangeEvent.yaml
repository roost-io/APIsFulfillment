config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "NotifyWorkOrderAttributeValueChangeEvent.csv"
    fields:
      - "eventName"
    skipHeader: true
    delimiter: "^|^"
  phases:
    - duration: 60
      arrivalRate: 20

scenarios:
  - name: "Notify work order attribute value change event"
    flow:
      - get:
          url: "/items/{{ eventName }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          capture:
            - json: "$.item_id"
              as: "itemId"
          expect:
            - statusCode: 200
            - hasProperty: "item_id"
          log: "Reading item id"
      - think: 1
      - get:
          url: "/items/{{ itemId }}/{{ eventName }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "item_id"
            - hasProperty: "name"
          log: "Reading item name"
      - think: 1
      - get:
          url: "/query?symbol={{ eventName }}&apikey=demo&function=TIME_SERIES_DAILY_ADJUSTED"
          expect:
            - statusCode: 200
          log: "Querying data"
      - think: 1
