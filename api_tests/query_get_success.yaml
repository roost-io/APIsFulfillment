# This is an artillery test configuration file
config:
  # The target host is fetched from the environment variable
  target: "{{ $processEnvironment.nurl1_API_HOST }}"
  # We use the `expect` plugin to add assertions
  plugins:
    expect: {}
  # The payload is read from a CSV file with the given fields
  payload:
    path: "query_get_success.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    # The CSV file uses a custom delimiter
    skipHeader: true
    delimiter: "^|^"

# We define a single scenario for our test
scenarios:
  - name: "API Endpoints Test Scenario"
    flow:
      # We log a message before starting the request
      - log: "Starting request for /query"
      - get:
          # The URL is constructed using the fields from the payload
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            # The authorization token is fetched from the environment variable
            name: "{{$processEnvironment.nurl1_AUTH_TOKEN}}"
          # We expect the status code to be 200 and the response to have certain properties
          expect:
            - statusCode: 200
            - hasProperty: "symbol"
            - hasProperty: "apikey"
            - hasProperty: "function"
      # We add a delay of 1 second between requests
      - think: 1
