config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    expect: {}
  payload:
    path: "ValidateSuccessResponseForBookingCanceled.csv"
    fields:
      - "item_id"
      - "name"
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"
scenarios:
  - name: "Validate success response for BOOKING_CANCELED"
    flow:
      - get:
          url: "/items/{{ item_id }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "item_id"
            - hasProperty: "value"
          log: "Received the expected response with item id and value"
      - think: 1
      - get:
          url: "/items/{{ item_id }}/{{ name }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "item_id"
            - hasProperty: "value"
            - hasProperty: "name"
          log: "Received the expected response with item id, value and name"
      - think: 1
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          log: "Received the expected response for the query with symbol, apikey and function"
