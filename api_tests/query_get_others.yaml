config:
  target: "{{ $processEnvironment.nurl1_API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    expect: {}
  payload:
    path: "query_get_others.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{$processEnvironment.nurl1_AUTH_TOKEN}}"

scenarios:
  - name: "Testing non-successful API responses"
    flow:
      - log: "Sending invalid GET request to /query"
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
      - think: 1

      - log: "Sending GET request to /query without authorization header"
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            Authorization: ""
          expect:
            - statusCode: 401
            - hasProperty: "error"
      - think: 1

      - log: "Sending GET request to invalid URL /invalid"
      - get:
          url: "/invalid?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          expect:
            - statusCode: 404
            - hasProperty: "error"
      - think: 1
