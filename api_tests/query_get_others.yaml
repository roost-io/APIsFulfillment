config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    expect: {}
  payload:
    path: "query_get_others.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{$processEnvironment.AUTH_TOKEN}}"

scenarios:
  - name: "Testing non-successful API responses"
    flow:
      - log: "Sending invalid GET request to /query"
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
            - equals:
                - "error.message": "Invalid request"
      - think: 1

      - log: "Sending GET request with invalid token to /query"
      - get:
          url: "/query?symbol={{ symbol }}&apikey=wrongtoken&function={{ function }}"
          expect:
            - statusCode: 401
            - hasProperty: "error"
            - equals:
                - "error.message": "Invalid token"
      - think: 1

      - log: "Sending GET request to non-existing endpoint"
      - get:
          url: "/non-existing-endpoint"
          expect:
            - statusCode: 404
            - hasProperty: "error"
            - equals:
                - "error.message": "Endpoint not found"
      - think: 1
